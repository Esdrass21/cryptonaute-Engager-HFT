global:
  scrape_interval: 5s
  evaluation_interval: 15s

scrape_configs:
  - job_name: cryptonaute
    static_configs:
      - targets: ["app:9100"]
    metrics_path: /metrics
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        replacement: cryptonaute-hft
