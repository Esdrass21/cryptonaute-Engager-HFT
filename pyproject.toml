[project]
name = "cryptonaute-hft"
version = "3.0.0"
description = "Cryptonaute Engager — Quant/News-Driven MFT Execution Platform (6-layer architecture)"
readme = "README.md"
requires-python = ">=3.12,<4"
license = { text = "MIT" }
authors = [{ name = "Cryptonaute Engager", email = "quant@cryptonaute.engager" }]
dependencies = [
    # Core data / numerics
    "numpy>=1.26,<3",
    "pandas>=2.2,<3",
    "polars>=1.0,<2",          # optional accelerator; imported lazily
    "scipy>=1.13,<2",
    "statsmodels>=0.14,<1",
    # Indicators / backtesting
    "pandas-ta>=0.3.14b0,<1",  # pre-1.0 -> <0.(minor+2)
    "ta-lib>=0.4.28,<1",       # optional; indicators also implemented in pure numpy
    "vectorbt>=0.26,<1",       # optional; paper/walk-forward helpers
    # ML
    "scikit-learn>=1.5,<2",
    "xgboost>=2.1,<3",         # optional
    # NLP / sentiment
    "spacy>=3.7,<4",           # optional; NER relevance filter
    "transformers>=4.40,<5",   # optional; FinBERT local scoring
    "torch>=2.2,<3",           # optional; FinBERT backend
    # News ingestion
    "feedparser>=6.0,<7",
    "httpx>=0.28.1,<1",
    "beautifulsoup4>=4.12,<5",
    # Broker / market feeds
    "MetaTrader5>=5.0.45,<6",
    "ccxt>=4.3,<5",
    # Scheduling / async
    "apscheduler>=3.10,<4",
    # Config / logging
    "pyyaml>=6.0,<7",
    "structlog>=24.1,<25",
    "pydantic>=2.7,<3",
    "python-dotenv>=1.0,<2",
    # State machine
    "transitions>=0.9,<1",
    # Message bus (Redis adapter optional; in-memory always available)
    "redis>=5.0,<6",
    # TimescaleDB / Postgres (optional; sqlite fallback for local)
    "psycopg[binary]>=3.1,<4",
    # Observability (optional; metrics collector works without it)
    "prometheus-client>=0.20,<1",
    # Monte Carlo / stats helpers
    "arch>=7.0,<8",            # optional; GARCH
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2,<9",
    "pytest-asyncio>=0.23,<1",
    "pytest-cov>=5.0,<6",
    "ruff>=0.5,<1",
]

[project.scripts]
cryptonaute = "main:main"

[build-system]
requires = ["setuptools>=68,<81"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["main", "orchestrator"]

[tool.pytest.ini_options]
markers = [
    "chaos: destructive fault-injection tests (run in CI nightly)",
]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-q"
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::FutureWarning",
]

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = [
    ".venv312",
    ".ruff_cache",
    "__pycache__",
    "*.pyc",
    "build",
    "wheels",
    "node_modules",
    "site-packages",
]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "B", "C4", "UP"]
ignore = ["B008", "C401", "C408", "E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B", "F401"]
