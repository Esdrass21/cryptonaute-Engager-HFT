# Cryptonaute HFT — default configuration overlay.
# This is deep-merged over the built-in Config.DEFAULTS (core/config.py).
# Behavioral settings live here; secrets live in .env (never committed).

platform:
  name: cryptonaute-hft
  version: "3.0.0"

mode: paper                      # paper | live

# Message bus: "memory" (deterministic default) or "redis" (multi-process).
bus:
  backend: memory
  redis_url: null

# Forex majors + crosses + commodities (metals, oil). MT5 broker names use
# the "m" suffix — see data.market.mt5.symbol_map.
symbols:
  - EURUSD
  - GBPUSD
  - USDJPY
  - USDCHF
  - AUDUSD
  - NZDUSD
  - USDCAD
  - EURGBP
  - EURJPY
  - GBPJPY
  - AUDJPY
  - EURAUD
  - EURCAD
  - EURNZD
  - GBPAUD
  - GBPCAD
  - GBPCHF
  - AUDCAD
  - AUDCHF
  - AUDNZD
  - NZDCAD
  - NZDJPY
  - CADJPY
  - CADCHF
  - CHFJPY
  - XAUUSD                  # gold
  - XAGUSD                  # silver
  - USOIL                   # WTI crude
  - UKOIL                   # Brent crude
  - BTCUSD                  # Bitcoin
timeframe: M5

data:
  market:
    source: mt5                 # sim | mt5 | crypto | hybrid | providers
    mt5:
      symbol_map:               # platform symbol -> broker symbol name
        EURUSD: EURUSDm
        GBPUSD: GBPUSDm
        USDJPY: USDJPYm
        USDCHF: USDCHFm
        AUDUSD: AUDUSDm
        NZDUSD: NZDUSDm
        USDCAD: USDCADm
        EURGBP: EURGBPm
        EURJPY: EURJPYm
        GBPJPY: GBPJPYm
        AUDJPY: AUDJPYm
        EURAUD: EURAUDm
        EURCAD: EURCADm
        EURNZD: EURNZDm
        GBPAUD: GBPAUDm
        GBPCAD: GBPCADm
        GBPCHF: GBPCHFm
        AUDCAD: AUDCADm
        AUDCHF: AUDCHFm
        AUDNZD: AUDNZDm
        NZDCAD: NZDCADm
        NZDJPY: NZDJPYm
        CADJPY: CADJPYm
        CADCHF: CADCHFm
        CHFJPY: CHFJPYm
        XAUUSD: XAUUSDm
        XAGUSD: XAGUSDm
        USOIL: USOILm
        UKOIL: UKOILm
        BTCUSD: BTCUSDm
        BTCUSDT: BTCUSDTm
    sim:
      interval_s: 1.0
      candles_per_tick: 5
    crypto:
      exchanges: [bybit, kraken, coinbase, okx, binance]
      symbol_map:
        kraken:
          BTCUSDT: BTC/USD
        coinbase:
          BTCUSDT: BTC/USD
      interval_s: 2.0           # ccxt REST poll cadence; public endpoints need no API key
    provider: alpaca            # alpaca | alphavantage | twelvedata | finazon (needs key in .env)
    providers:
      interval_s: 30.0
      alpaca:
        symbol_map:             # platform symbol -> provider symbol (null = skip)
          EURUSD: EUR/USD
          GBPUSD: GBP/USD
          USDJPY: USD/JPY
          USDCHF: USD/CHF
          AUDUSD: AUD/USD
          NZDUSD: NZD/USD
          USDCAD: USD/CAD
          EURGBP: null          # crosses unsupported by Alpaca FX
          EURJPY: null
          GBPJPY: null
          AUDJPY: null
          EURAUD: null
          EURCAD: null
          EURNZD: null
          GBPAUD: null
          GBPCAD: null
          GBPCHF: null
          AUDCAD: null
          AUDCHF: null
          AUDNZD: null
          NZDCAD: null
          NZDJPY: null
          CADJPY: null
          CADCHF: null
          CHFJPY: null
          XAUUSD: null
          XAGUSD: null
          USOIL: null
          UKOIL: null
          BTCUSD: BTC/USD
      alphavantage:
        symbol_map:
          EURUSD: EUR/USD
          GBPUSD: GBP/USD
          USDJPY: USD/JPY
          USDCHF: USD/CHF
          AUDUSD: AUD/USD
          NZDUSD: NZD/USD
          USDCAD: USD/CAD
          XAUUSD: null          # metals need the premium endpoint
          XAGUSD: null
          USOIL: null
          UKOIL: null
          BTCUSD: BTC
      twelvedata:
        symbol_map:
          EURUSD: EUR/USD
          GBPUSD: GBP/USD
          USDJPY: USD/JPY
          USDCHF: USD/CHF
          AUDUSD: AUD/USD
          NZDUSD: NZD/USD
          USDCAD: USD/CAD
          EURGBP: EUR/GBP
          EURJPY: EUR/JPY
          GBPJPY: GBP/JPY
          AUDJPY: AUD/JPY
          EURAUD: EUR/AUD
          EURCAD: EURCAD
          EURNZD: EUR/NZD
          GBPAUD: GBP/AUD
          GBPCAD: GBP/CAD
          GBPCHF: GBP/CHF
          AUDCAD: AUD/CAD
          AUDCHF: AUD/CHF
          AUDNZD: AUD/NZD
          NZDCAD: NZD/CAD
          NZDJPY: NZD/JPY
          CADJPY: CAD/JPY
          CADCHF: CAD/CHF
          CHFJPY: CHF/JPY
          XAUUSD: XAU/USD
          XAGUSD: XAG/USD
          USOIL: null
          UKOIL: null
          BTCUSD: BTC/USD
      finazon:
        symbol_map:
          EURUSD: EURUSD
          GBPUSD: GBPUSD
          USDJPY: USDJPY
          USDCHF: USDCHF
          AUDUSD: AUDUSD
          NZDUSD: NZDUSD
          USDCAD: USDCAD
          EURGBP: EURGBP
          EURJPY: EURJPY
          GBPJPY: GBPJPY
          AUDJPY: AUDJPY
          EURAUD: EURAUD
          EURCAD: EURCAD
          EURNZD: EURNZD
          GBPAUD: GBPAUD
          GBPCAD: GBPCAD
          GBPCHF: GBPCHF
          AUDCAD: AUDCAD
          AUDCHF: AUDCHF
          AUDNZD: AUDNZD
          NZDCAD: NZDCAD
          NZDJPY: NZDJPY
          CADJPY: CADJPY
          CADCHF: CADCHF
          CHFJPY: CHFJPY
          XAUUSD: XAUUSD
          XAGUSD: XAGUSD
          USOIL: USOIL
          UKOIL: UKOIL
  news:
    source: sim                 # sim | rss | factory
    sim:
      every_n_ticks: 20
    rss:
      poll_every_n_ticks: 200   # re-poll live RSS feeds every N ticks
    rss_feeds: []               # empty -> built-in forexlive/investing/cointelegraph/fxstreet
    bls:
      race_mode: false
      lookahead_s: 300.0
      arm_before_s: 120.0
      refresh_interval_s: 3600.0
      race_timeout_ms: 500.0
    fed:
      enabled: true
      poll_interval_s: 300.0
    zillow:
      enabled: true
      poll_interval_s: 86400.0
      us_region: "United States"
    ism:
      enabled: true
      poll_interval_s: 86400.0
    challenger:
      enabled: true
      poll_interval_s: 86400.0
    forexfactory:
      enabled: true
      poll_interval_s: 3600.0
      arm_before_s: 120.0
      lookahead_s: 604800.0
      countries: [USD, EUR, GBP, JPY]
      min_impact: "High"
    gdelt:
      enabled: false
      poll_interval_s: 300.0
      max_records: 250
      queries:
        - id: "FED"
          q: '(federal reserve OR FOMC OR powell) sourcelang:english'
          symbols: [EURUSD, XAUUSD]
        - id: "CPI"
          q: '(inflation OR "consumer price index" OR CPI) sourcelang:english'
          symbols: [EURUSD, XAUUSD]
        - id: "GEO"
          q: '(sanctions OR "central bank" OR "interest rate") sourcelang:english'
          symbols: [XAUUSD, EURUSD]
    # surprise stddev for normalizing surprises (configurable per release)
    surprise_std:
      NFP: 70.0                 # thousands
      CPI_YOY: 0.15             # percentage points
      CPI_MOM: 0.05
      CORE_CPI_YOY: 0.15
      UNEMPLOYMENT_RATE: 0.10
      PPI_YOY: 0.20
  fred:
    series:
      - ICSA
      - CCSA
      - ADPMNUSNERSA
      - JTSHIR
      - JTSJOL
      - RSAFS
      - PCEPI
      - PCEPILFE
      - DGS2
      - DGS10
      - DCOILWTICO
      - GASREGW
    poll_interval_s: 3600.0
  consensus:
    overrides: []
  calendar:
    # Optional explicit overrides — used when you know the exact time and consensus
    overrides: []
    #  - release_id: CPI_YOY
    #    source: BLS
    #    scheduled_ts: 1730000000.0
    #    consensus: 0.3
    #    prior: 0.2
    #    units: percent

analytics:
  regime_model: statistical
  order_flow:
    enabled: false              # §3.4: hypotheses NOT validated yet -> OFF
    validated_only: true
  quant:
    ma_fast: 12
    ma_slow: 26
    rsi_n: 14

nlp:
  backend: lexicon              # lexicon | finbert | mistral
  finbert_model: "ProsusAI/finbert"

self_correction:
  enabled: true
  mistral:
    model: "mistral-large-latest"
    timeout_s: 20.0
    backend: stub              # stub | mistral (needs MISTRAL_API_KEY)

strategy:
  enabled: ["tsmom", "noise_band"]
  composite:
    threshold: 0.55
    tech_weight: 0.45
    news_weight: 0.25
    macro_weight: 0.15
    regime_weight: 0.10
    of_weight: 0.05
  exit_flip_conviction: 0.15
  noise_band:
    enabled: true
    lookback: 96                # rolling window (candles) for the noise sigma (tuned)
    k: 3.0                      # tighter band in sigmas (filters retail spread on high-trend pairs)
    confirm_n: 2                # consecutive closes beyond band required to enter
    min_bars: 30                # warm-up before any decision
    min_band: 0.00005           # floor for the band (prevents dead-market micro-trades)
    position_pct: 0.5
    sl_mult: 2.0                # SL = sl_mult * band (in return space)
    tp_mult: 4.0                # TP = tp_mult * band
    max_holding_s: 14400.0
    cooldown_s: 1800.0
    max_concurrent: 1
    symbols:
      - BTCUSD                  # Sharpe 2.20 @ 1 bps, net return +4.08%
      - EURUSD
      - USDCAD
      - USDJPY
  tsmom:
    enabled: true
    lookbacks: [1440]               # 5-day lookback (top performer in strategy_lab on MT5)
    rebalance_s: 86400.0           # once per day (lab-validated discrete daily rebalance)
    vol_win: 288                   # rolling window for the ex-ante vol estimator
    vol_target: 0.5                # annualized vol targeted per position
    max_leverage: 1.0
    min_bars: 1441                 # warm-up: 5d lookback
    symbols:
      - USDCAD
      - EURUSD
      - EURGBP
      - USDJPY
      - GBPJPY
      - USOIL
      - BTCUSD
  ev:
    min_expected_value: 0.2
    min_confidence: 0.6
    calibrated: false          # MUST be true before live (§7.3 gate)

execution:
  broker: paper                 # paper | mt5 | crypto
  exchange: binance             # when broker=crypto: binance | bybit | okx | kraken | coinbase
  max_retry: 3
  base_backoff_s: 0.5
  slippage_tolerance_pct: 0.05
  poll_rtt_adaptive: true

  # --- Phase 4 ---
  commission_bps: 1.0        # set to 0.0 to match pre-Phase-4 P&L exactly
  retry_partial: true        # retry the residual on partial fills
  book:
    n_levels: 5
    tick_size_bps: 1.0       # half-spread in bps
    top_size_notional: 50000.0
    depth_growth: 1.6        # size_k = top * growth**k
    size_jitter: 0.25

  # --- Phase 4.5 ---
  order_type: market          # market | limit
  limit_offset_bps: 5.0       # limit price = mid ∓ offset
  limit_ttl_s: 5.0            # seconds before unfilled limit expires
  queue_flow_multiplier: 5.0  # flow = return * top_size * multiplier
  queue_erosion_rate: 0.05    # fraction of queue_ahead removed per near-limit tick
  queue_erosion_ticks: 2      # "near" = within this many ticks of the limit

risk:
  max_position_pct: 2.0
  max_daily_drawdown_pct: 2.0
  max_correlation: 0.7
  hard_cap_pct: 5.0            # non-negotiable ceiling
  var_confidence: 0.95
  veto_service:
    enabled: true
  circuit_breaker:
    enabled: true

validation:
  backtest:
    initial_capital: 10000.0
  walk_forward:
    train_pct: 0.5
    test_pct: 0.1
    step_pct: 0.1
    n_splits: 5
    embargo_pct: 0.01
    horizon: 1
  monte_carlo:
    n_paths: 1000
    block_size: 10
  execution:
    latency_ms: 30.0
    latency_jitter_ms: 10.0
    slippage_bps: 1.5
    slippage_df: 4.0
    spread_bps: 0.5
    commission_bps: 1.0
    partial_fill_prob: 0.10
    partial_fill_frac: [0.3, 0.9]
    reference_notional: 100000.0
    seed: 0
  gate:
    min_dsr: 0.0        # raise to e.g. 0.95 in live mode
    max_pbo: 0.5

observability:
  prometheus:
    enabled: false
    port: 9100
  log_level: INFO

# Durable, append-only event log. Every event that passes schema validation
# is persisted BEFORE dispatch — audit trail + crash recovery.
event_log:
  enabled: true
  backend: file           # file | memory  (redis planned)
  path: data/events.jsonl
  fsync: true
  checkpoint_path: data/events.jsonl.checkpoint

validation:
  signal_log:
    enabled: false                     # opt-in — turn on for drift analysis
    path: data/signal_log.jsonl

# Signing key provider: env (dev) | file (production keyring).
keys:
  provider: env
  env_var: RISK_SIGNING_KEY
  key_id: env:default
  # For provider=file:
  # keyring_path: /etc/cryptonaute/keyring.json

# Two-person rule for sensitive ops (circuit breaker reset, live activation,
# risk-limit changes, key rotation).
two_person:
  min_approvers: 1        # set to 2 for live

# Immutable audit log for two-person decisions.
audit:
  path: data/audit.jsonl
  fsync: true


nowcast:
  nfp:
    coefficients_path: config/nowcast/nfp_coefficients.json
  cpi:
    coefficients_path: config/nowcast/cpi_coefficients.json

strategy:
  release_drift:
    enabled: true
    min_surprise_z: 1.5
    max_concurrent: 1
    rules: {}

notifications:
  telegram:
    enabled: true
    bot_token_env: TELEGRAM_BOT_TOKEN
    chat_id_env: TELEGRAM_CHAT_ID
    relay_channel_env: RELAY_CHANNEL   # relay/aggregator channel
    # relay_channel: "@Cryptonaute_Engager"   # optional explicit override of the env var
    # The relay channel mirrors ALL subscribed events by default. To restrict it
    # (e.g. confirmed fills/exits only), set an explicit list here:
    # relay_events: [order_fill, order_exit]
    # Optional: hardcode the channel (less secure — prefer env):
    # chat_id: "-100xxxxxxxxxx"
    min_severity: "info"          # info | warning | critical
    events:
      - order_proposal
      - risk_veto
      - order_fill
      - order_reject
      - circuit_breaker
      - release_actual
      - nowcast
      - order_exit
    allow_in_replay: false
    rate_per_min: 20
    queue_size: 500
